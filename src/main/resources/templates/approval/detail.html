<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>결재 상세</title>
</head>
<body>

<div th:replace="~{layout/header :: header}"></div>

<h2>결재 상세</h2>

<table>
    <tr>
        <th>결재 단계</th>
        <td th:text="${approval.approvalStep}"></td>
    </tr>
    <tr>
        <th>결재자</th>
        <td th:text="${approval.userId}"></td>
    </tr>
    <tr>
        <th>결재 상태</th>
        <td th:text="${approval.approvalStatus}"></td>
    </tr>
    <tr>
        <th>코멘트</th>
        <td th:text="${approval.comment}"></td>
    </tr>
    <tr>
        <th>결재일</th>
        <td th:text="${approval.createdAt}"></td>
    </tr>
</table>

<a href="/budget-requests">예산신청서 목록으로</a>

</body>
</html>
