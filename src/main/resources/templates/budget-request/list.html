<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>예산신청서 목록</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<div th:replace="~{layout/header :: header}"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>예산신청서 목록</h2>
        <a href="/budget-requests/new" class="btn btn-primary">신규 신청</a>
    </div>

    <table class="table table-hover">
        <thead class="table-dark">
            <tr>
                <th>번호</th>
                <th>제목</th>
                <th>신청금액</th>
                <th>상태</th>
                <th>신청일</th>
                <th>상세</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="budgetRequest : ${budgetRequests}">
                <td th:text="${budgetRequest.id}"></td>
                <td th:text="${budgetRequest.title}"></td>
                <td th:text="${budgetRequest.budgetAmount}"></td>
                <td th:text="${budgetRequest.status}"></td>
                <td th:text="${#temporals.format(budgetRequest.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                <td><a th:href="@{/budget-requests/{id}(id=${budgetRequest.id})}" class="btn btn-sm btn-outline-primary">상세보기</a></td>
            </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
