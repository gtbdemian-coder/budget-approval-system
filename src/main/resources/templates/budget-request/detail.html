<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>예산신청서 상세</title>
</head>
<body>

<div th:replace="~{layout/header :: header}"></div>

<h2>예산신청서 상세</h2>

<table>
    <tr>
        <th>제목</th>
        <td th:text="${budgetRequest.title}"></td>
    </tr>
    <tr>
        <th>신청금액</th>
        <td th:text="${budgetRequest.budgetAmount}"></td>
    </tr>
    <tr>
        <th>코멘트</th>
        <td th:text="${budgetRequest.comment}"></td>
    </tr>
    <tr>
        <th>상태</th>
        <td th:text="${budgetRequest.status}"></td>
    </tr>
    <tr>
        <th>신청일</th>
        <td th:text="${budgetRequest.createdAt}"></td>
    </tr>
</table>

<h3>결재 이력</h3>
<table>
    <thead>
        <tr>
            <th>단계</th>
            <th>결재자</th>
            <th>상태</th>
            <th>코멘트</th>
            <th>결재일</th>
        </tr>
    </thead>
    <tbody>
    <tr th:each="approval : ${approvals}">
        <td th:text="${approval.approvalStep}"></td>
        <td th:text="${approval.userId}"></td>
        <td th:text="${approval.approvalStatus}"></td>
        <td th:text="${approval.comment}"></td>
        <td th:text="${approval.createdAt}"></td>
    </tr>
    </tbody>
</table>

<a href="/budget-requests">목록으로</a>

</body>
</html>
