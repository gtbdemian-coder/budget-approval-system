<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>예산신청서 상세</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<div th:replace="~{layout/header :: header}"></div>

<div class="container mt-4">
    <h2 class="mb-4">예산신청서 상세</h2>
    <div class="card mb-4">
        <div class="card-body">
            <table class="table">
                <tr>
                    <th class="w-25">제목</th>
                    <td th:text="${budgetRequest.title}"></td>
                </tr>
                <tr>
                    <th>신청금액</th>
                    <td th:text="${budgetRequest.budgetAmount}"></td>
                </tr>
                <tr>
                    <th>코멘트</th>
                    <td th:text="${budgetRequest.comment}"></td>
                </tr>
                <tr>
                    <th>상태</th>
                    <td th:text="${budgetRequest.status}"></td>
                </tr>
                <tr>
                    <th>신청일</th>
                    <td th:text="${#temporals.format(budgetRequest.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                </tr>
            </table>
        </div>
    </div>


    <h4 class="mb-3">결재 이력</h4>
    <table class="table table-hover">
        <thead class="table-dark">
            <tr>
                <th>단계</th>
                <th>결재자</th>
                <th>상태</th>
                <th>코멘트</th>
                <th>결재일</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="approval : ${approvals}">
                <td th:text="${approval.approvalStep}"></td>
                <td th:text="${approval.userName}"></td>
                <td th:text="${approval.approvalStatus}"></td>
                <td th:text="${approval.comment}"></td>
                <td th:text="${#temporals.format(approval.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
            </tr>
        </tbody>
    </table>

    <a href="/budget-requests" class="btn btn-secondary">목록으로</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
