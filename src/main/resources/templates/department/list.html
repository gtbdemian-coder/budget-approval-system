<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>부서 목록</title>
</head>
<body>

<div th:replace="~{layout/header :: header}"></div>

<h2>부서 목록</h2>

<table>
    <thead>
        <tr>
            <th>번호</th>
            <th>부서명</th>
            <th>예산 한도</th>
            <th>상세</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="department : ${departments}">
            <td th:text="${department.id}"></td>
            <td th:text="${department.departmentName}"></td>
            <td th:text="${department.budgetLimit}"></td>
            <td><a th:href="@{/departments/{id}(id=${department.id})}">상세보기</a></td>
        </tr>
    </tbody>
</table>
</body>
</html>
