<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>부서 상세</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<div th:replace="~{layout/header :: header}"></div>

<div class="container mt-4">
    <h2 class="mb-4">부서 상세</h2>

    <div class="card">
        <div class="card-body">
            <table class="table">
                <tr>
                    <th class="w-25">부서명</th>
                    <td th:text="${department.departmentName}"></td>
                </tr>
                <tr>
                    <th>예산 한도</th>
                    <td th:text="${department.budgetLimit}"></td>
                </tr>
                <tr>
                    <th>생성일</th>
                    <td th:text="${#temporals.format(department.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                </tr>
            </table>
        </div>
    </div>
    <a href="/departments" class="btn btn-secondary mt-3">목록으로</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
