<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>부서 상세</title>
</head>
<body>

<div th:replace="~{layout/header :: header}"></div>

<h2>부서 상세</h2>

<table>
    <tr>
        <th>부서명</th>
        <td th:text="${department.departmentName}"></td>
    </tr>
    <tr>
        <th>예산 한도</th>
        <td th:text="${department.budgetLimit}"></td>
    </tr>
    <tr>
        <th>생성일</th>
        <td th:text="${#temporals.format(budgetRequest.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
    </tr>
</table>

<a href="/departments">목록으로</a>

</body>
</html>
