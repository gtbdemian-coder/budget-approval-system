<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>알림 목록</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<div th:replace="~{layout/header :: header}"></div>

<div class="container mt-4">
    <h2 class="mb-4">알림 목록</h2>

    <ul class="list-group">
        <li class="list-group-item d-flex justify-content-between align-items-center"
            th:each="notification : ${notifications}">
            <div>
                <span th:text="${notification.message}"></span>
                <small class="text-muted ms-2" th:text="${#temporals.format(notification.createdAt, 'yyyy-MM-dd HH:mm')}"></small>
            </div>
            <div>
                <span class="badge bg-danger me-2" th:if="${!notification.isRead}">읽지 않음</span>
                <form th:action="@{/notifications/{id}/read(id=${notification.id})}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-outline-secondary">읽음 처리</button>
                </form>
            </div>
        </li>
    </ul>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
