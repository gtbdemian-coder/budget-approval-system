<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>대시보드</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>

<div th:replace="~{layout/header :: header}"></div>

<div class="container mt-4">
    <h2 class="mb-4">대시보드</h2>

    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card text-white bg-warning">
                <div class="card-body">
                    <h5 class="card-title">대기중</h5>
                    <p class="card-text fs-3" th:text="${pendingCount}"></p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-white bg-success">
                <div class="card-body">
                    <h5 class="card-title">승인</h5>
                    <p class="card-text fs-3" th:text="${approvedCount}"></p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-white bg-danger">
                <div class="card-body">
                    <h5 class="card-title">반려</h5>
                    <p class="card-text fs-3" th:text="${rejectedCount}"></p>
                </div>
            </div>
        </div>
    </div>

        <h4 class="mb-3">최근 알림</h4>
        <ul class="list-group">
            <li class="list-group-item" th:each="notification: ${notifications}"
                th:text="${notification.message}"></li>
        </ul>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
